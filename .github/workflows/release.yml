name: Validate and release theme
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Layout behavior
        run: |
          php .tests/layout.php
          php .tests/product-hover.php
          php .tests/editorial.php
          php .tests/header.php
          php .tests/typography.php
          php .tests/swatches.php
          php .tests/gallery-design.php
          php .tests/theme-updates.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/premium-shop.js
          node --check assets/js/product-hover.js
          node --check assets/js/gallery-design.js
          node --check assets/js/swatches.js
          node --check assets/js/swatches-admin.js
          node --check assets/js/bestsellers-tabs.js
          node scripts/verify-catalog.cjs
          node scripts/verify-hover.cjs
          node scripts/verify-gallery.cjs
          node scripts/verify-bestsellers.cjs
          node scripts/verify-scroll.cjs
      - name: Match release tag to theme versions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Use vX.Y.Z'
          assert re.search(r'^Version:\s*' + re.escape(version) + r'\s*$', Path('style.css').read_text(), re.M), 'style.css version mismatch'
          assert "define( 'JOFME_VERSION', '" + version + "' );" in Path('functions.php').read_text(), 'functions.php version mismatch'
          PY
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: jofme-theme
          path: dist/jofme.zip
  hover-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/jofme-browser" playwright@1.62.1 pngjs@7.0.0 --no-audit --no-fund
          "$RUNNER_TEMP/jofme-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check painted product image after hover transition
        run: NODE_PATH="$RUNNER_TEMP/jofme-browser/node_modules" node .tests/hover-browser.cjs
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, hover-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jofme-theme
          path: dist
      - name: Publish installable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/jofme.zip --title "Jofme $RELEASE_TAG" --generate-notes --verify-tag
